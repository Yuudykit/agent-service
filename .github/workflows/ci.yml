# 质量回路：push / PR 时自动跑单测 + mock 评测（零 API 成本）。
# 防"评测全过但行为坏了"的回归（项目史上真实发生过：缩进回归 bug）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EMBEDDER_BACKEND: hash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install -r requirements-dev.txt

      # 索引文件不入库（派生产物可重建），CI 显式重建 hash 索引
      - name: Build RAG index
        run: python -m rag.build

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Offline mock regression
        run: python -m eval.eval_script
