<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>售后工作台 · 智能客服 Agent</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-brand" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H4l1.6-4.4A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8.5 11.5h.01m3.5 0h.01m3.5 0h.01"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6.5C10 4.5 6.5 4 3 5v13c3.5-1 7-.5 9 1.5 2-2 5.5-2.5 9-1.5V5c-3.5-1-7-.5-9 1.5Zm0 0v13"/></symbol>
    <symbol id="icon-box" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 9 8-4.5M12 12 4 7.5M12 12v9M8 5.3l8 4.5"/></symbol>
    <symbol id="icon-refund" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 1.8 6M4 11V6m0 5h5M10 8l2 3 2-3m-4 4h4m-4 2h4m-2-3v5"/></symbol>
    <symbol id="icon-headset" viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0 1 16 0v1m0 4v1a2 2 0 0 1-2 2h-4M4 13h3v5H5a1 1 0 0 1-1-1Zm16 0h-3v5h2a1 1 0 0 0 1-1Z"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-6 4 12 3-6h4"/></symbol>
    <symbol id="icon-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14 5v14"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#icon-brand"/></svg></span>
      <div><strong>售后工作台</strong><span class="brand-caption">电商智能客服 Agent</span></div>
    </div>
    <div class="header-actions">
      <span class="mode-badge"><i></i><span id="mode-badge">离线演示</span></span>
      <a class="button button-quiet monitor-link" href="/monitor" target="_blank" rel="noopener" aria-label="运行监控" title="运行监控">
        <svg class="icon"><use href="#icon-activity"/></svg><span>运行监控</span>
      </a>
      <button type="button" class="button button-quiet panel-toggle" id="panel-toggle" aria-expanded="false" aria-controls="session-panel" aria-label="会话面板">
        <svg class="icon"><use href="#icon-panel"/></svg><span>会话面板</span>
      </button>
      <button type="button" class="button button-quiet" id="new-session">
        <svg class="icon"><use href="#icon-plus"/></svg>新会话
      </button>
    </div>
  </header>

  <div class="workspace">
    <main class="conversation" aria-label="售后会话">
      <div id="conversation-scroll" class="conversation-scroll">
        <section class="welcome" id="welcome" aria-labelledby="welcome-heading">
          <div class="welcome-copy">
            <h1 id="welcome-heading">今天需要处理什么？</h1>
            <p>选择一项售后服务，或在下方直接提问。</p>
          </div>
          <div class="service-grid">
            <button type="button" class="service-card" data-service="faq" aria-controls="service-form" aria-expanded="false">
              <span class="service-icon faq-icon"><svg class="icon"><use href="#icon-book"/></svg></span>
              <span class="service-text"><strong>售后问答</strong><small>查退款时效、退换货和发票规则</small></span>
              <svg class="icon card-arrow"><use href="#icon-arrow"/></svg>
            </button>
            <button type="button" class="service-card" data-service="order" aria-controls="service-form" aria-expanded="false">
              <span class="service-icon order-icon"><svg class="icon"><use href="#icon-box"/></svg></span>
              <span class="service-text"><strong>订单查询</strong><small>按订单号查看商品和物流状态</small></span>
              <svg class="icon card-arrow"><use href="#icon-arrow"/></svg>
            </button>
            <button type="button" class="service-card" data-service="refund" aria-controls="service-form" aria-expanded="false">
              <span class="service-icon refund-icon"><svg class="icon"><use href="#icon-refund"/></svg></span>
              <span class="service-text"><strong>退款试算</strong><small>按订单和退款原因估算金额</small></span>
              <svg class="icon card-arrow"><use href="#icon-arrow"/></svg>
            </button>
            <button type="button" class="service-card" data-service="handoff" aria-controls="service-form" aria-expanded="false">
              <span class="service-icon handoff-icon"><svg class="icon"><use href="#icon-headset"/></svg></span>
              <span class="service-text"><strong>转人工交接</strong><small>将诉求和会话整理为本地记录</small></span>
              <svg class="icon card-arrow"><use href="#icon-arrow"/></svg>
            </button>
          </div>
        </section>
        <div id="messages" class="messages" role="log" aria-label="会话消息" aria-live="polite" aria-relevant="additions" hidden></div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <div class="service-shortcuts" id="service-shortcuts" aria-label="服务入口" hidden>
            <button type="button" data-service="faq" aria-controls="service-form" aria-expanded="false">售后问答</button>
            <button type="button" data-service="order" aria-controls="service-form" aria-expanded="false">订单查询</button>
            <button type="button" data-service="refund" aria-controls="service-form" aria-expanded="false">退款试算</button>
            <button type="button" data-service="handoff" aria-controls="service-form" aria-expanded="false">转人工交接</button>
          </div>
          <form class="service-form" id="service-form" aria-labelledby="service-title" hidden>
            <div class="form-heading">
              <h2 id="service-title"></h2>
              <button type="button" class="button icon-button" id="close-service" aria-label="关闭服务表单">
                <svg class="icon"><use href="#icon-close"/></svg>
              </button>
            </div>
            <div id="faq-fields" class="faq-fields" hidden>
              <button type="button" data-prompt="退款多久能到账？">退款到账时效<svg class="icon"><use href="#icon-arrow"/></svg></button>
              <button type="button" data-prompt="已经开好的发票税号填错了，怎么修改？">发票税号修改<svg class="icon"><use href="#icon-arrow"/></svg></button>
              <button type="button" data-prompt="商品坏了，可以换货吗？">商品损坏换货<svg class="icon"><use href="#icon-arrow"/></svg></button>
            </div>
            <div class="service-fields" id="service-fields" hidden>
              <div class="field" id="order-field" hidden>
                <div class="field-heading"><label for="order-id">订单号</label><button type="button" class="text-button" id="sample-order">填入示例订单</button></div>
                <input id="order-id" name="order-id" placeholder="例如 JD20260815001" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false">
              </div>
              <div class="field" id="refund-field" hidden>
                <label for="refund-reason">退款原因</label>
                <select id="refund-reason" name="refund-reason">
                  <option value="ordinary">个人原因</option>
                  <option value="quality">商品质量问题</option>
                </select>
              </div>
              <div class="field" id="handoff-field" hidden>
                <label for="handoff-reason">希望人工处理的问题 <span>选填</span></label>
                <input id="handoff-reason" name="handoff-reason" placeholder="例如 物流停滞，希望帮忙核实" maxlength="180">
              </div>
              <button type="submit" class="button button-primary service-submit" id="submit-service"></button>
            </div>
            <p class="service-note" id="service-note" hidden></p>
          </form>

          <form class="message-form" id="message-form">
            <label class="sr-only" for="message-input">输入售后问题</label>
            <textarea id="message-input" placeholder="输入售后问题…" rows="1" maxlength="2000"></textarea>
            <button type="submit" class="button button-primary send-button" id="send-message" aria-label="发送消息" disabled>
              <svg class="icon"><use href="#icon-send"/></svg>
            </button>
          </form>
          <p class="composer-hint"><span id="composer-status" role="status"></span><span class="keyboard-hint">Enter 发送 <span>·</span> Shift + Enter 换行</span></p>
        </div>
      </div>
    </main>

    <aside class="session-panel" id="session-panel" aria-label="会话面板">
      <section class="panel-section">
        <h2>运行模式</h2>
        <fieldset class="mode-options">
          <legend class="sr-only">选择运行模式</legend>
          <label><input type="radio" name="mode" id="mode-mock" value="mock" checked><span>离线演示</span></label>
          <label><input type="radio" name="mode" id="mode-real" value="real" disabled><span>真实模型</span></label>
        </fieldset>
        <p id="mode-note" class="panel-note">离线演示可直接使用，正在检查真实模型配置。</p>
      </section>

      <section class="panel-section">
        <h2>当前会话</h2>
        <dl class="session-details">
          <div><dt>会话状态</dt><dd><span class="status-dot" id="session-dot"></span><span id="session-status">待开始</span></dd></div>
          <div><dt>已发送</dt><dd id="session-count">0 条</dd></div>
          <div id="latency-row" hidden><dt>最近耗时</dt><dd id="latency"></dd></div>
          <div id="tokens-row" hidden><dt>最近用量</dt><dd id="tokens"></dd></div>
        </dl>
      </section>

      <section class="panel-section activity-panel">
        <h2>本轮工具</h2>
        <div class="activity-empty" id="activity-empty">
          <span><svg class="icon"><use href="#icon-activity"/></svg></span>
          <p>发送消息后查看工具调用</p>
        </div>
        <ol id="tool-list" class="tool-list" aria-label="本轮工具调用" hidden></ol>
      </section>
    </aside>
  </div>
  <template id="feedback-template">
    <div class="reply-feedback" aria-label="评价本轮回复">
      <button type="button" data-rating="helpful" aria-pressed="false">有帮助</button>
      <button type="button" data-rating="unhelpful" aria-pressed="false">没帮助</button>
      <select aria-label="没帮助的原因" hidden>
        <option value="">选择原因（可选）</option>
        <option value="irrelevant">答非所问</option>
        <option value="incorrect">信息不准</option>
        <option value="unresolved">问题没解决</option>
        <option value="slow">等待太久</option>
      </select>
      <span role="status"></span>
      <a target="_blank" rel="noopener">查看本轮记录 ↗</a>
    </div>
  </template>
</body>
</html>
