<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 · agent-service</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    background: #fff;
    box-shadow: 0 2px 24px rgba(0,0,0,.08);
    border-radius: 12px;
    overflow: hidden;
  }
  /* ---------- 顶栏 ---------- */
  header {
    background: #e1251b;
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #fff;
    color: #e1251b;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    flex-shrink: 0;
  }
  header .info { flex: 1; min-width: 0; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  /* 模式开关 */
  .mode-switch { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; user-select: none; }
  .mode-switch input { cursor: pointer; accent-color: #fff; width: 15px; height: 15px; }
  .btn-new {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.5);
    color: #fff;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-new:hover { background: rgba(255,255,255,.3); }
  /* ---------- 消息区 ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; gap: 10px; max-width: 86%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .who {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg.bot .who { background: #fdeaea; }
  .msg.user .who { background: #e8f1ff; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .bubble { background: #f5f6f8; color: #222; border-top-left-radius: 4px; }
  .msg.user .bubble { background: #e1251b; color: #fff; border-top-right-radius: 4px; }
  .bubble.error { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
  /* 打字中 */
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #b6bac1;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
  /* 系统提示条 */
  .sys-tip {
    align-self: center;
    font-size: 12px;
    color: #999;
    background: #f4f5f7;
    border-radius: 10px;
    padding: 4px 14px;
  }
  /* ---------- 输入区 ---------- */
  footer {
    border-top: 1px solid #eee;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    background: #fff;
  }
  #input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    resize: none;
    font-family: inherit;
    height: 42px;
    transition: border-color .15s;
  }
  #input:focus { border-color: #e1251b; }
  #send {
    background: #e1251b;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-size: 14px;
    cursor: pointer;
    height: 42px;
    transition: background .15s;
  }
  #send:hover { background: #c31d14; }
  #send:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">客</div>
    <div class="info">
      <h1>智能客服小帮手</h1>
      <div class="sub" id="subTitle">agent-service · 支持订单查询 / 退款计算 / 知识库问答</div>
    </div>
    <div class="toolbar">
      <label class="mode-switch" title="勾选=mock 模式（不调 API、不耗 token）；取消=真实模式（调 DeepSeek，耗 token）">
        <input type="checkbox" id="mockToggle" checked> mock 模式
      </label>
      <button class="btn-new" id="btnNew">新会话</button>
    </div>
  </header>

  <div id="chat">
    <div class="sys-tip">你好，我是智能客服小帮手。可以问我发货、退款、发票、换货等售后问题 😊</div>
  </div>

  <footer>
    <textarea id="input" placeholder="输入消息，Enter 发送（Shift+Enter 换行）" rows="1"></textarea>
    <button id="send">发送</button>
  </footer>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const mockToggle = document.getElementById('mockToggle');
const btnNew = document.getElementById('btnNew');

let sessionId = null;      // null → 首次发消息时由后端分配
let busy = false;

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = role === 'bot'
    ? '<div class="who">💬</div><div class="bubble"></div>'
    : '<div class="who">🧑</div><div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  chat.appendChild(div);
  scrollBottom();
  return div.querySelector('.bubble');
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = '<div class="who">💬</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chat.appendChild(div);
  scrollBottom();
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  addMsg('user', text);

  const typingEl = addTyping();
  let bubble = null;   // 当前回答气泡（收到第一个 delta 时创建）
  let acc = '';        // 已累计的流式文本

  function ensureBubble() {
    if (!bubble) {
      typingEl.remove();
      bubble = addMsg('bot', '');
    }
    return bubble;
  }
  function addTip(text) {
    const tip = document.createElement('div');
    tip.className = 'sys-tip';
    tip.textContent = text;
    chat.appendChild(tip);
    scrollBottom();
  }

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        mock: mockToggle.checked,
      }),
    });
    // SSE 流式读取（EventSource 不支持 POST，手动解析 data: 帧）
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const line = frame.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        handleEvent(JSON.parse(line.slice(6)));
      }
    }
  } catch (e) {
    ensureBubble().textContent = acc || '⚠️ 网络错误：' + e.message;
    ensureBubble().classList.add('error');
  } finally {
    if (typingEl.parentNode) typingEl.remove();
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function handleEvent(evt) {
    if (evt.type === 'session') {
      sessionId = evt.session_id;
    } else if (evt.type === 'tool') {
      const labels = {
        query_info: '查询订单信息', calculate_refund: '计算退款金额',
        search_kb: '检索知识库', transfer_human: '转接人工客服',
      };
      addTip('⚙️ ' + (labels[evt.name] || evt.name) + '…');
    } else if (evt.type === 'delta') {
      acc += evt.text;
      ensureBubble().textContent = acc;
      scrollBottom();
    } else if (evt.type === 'done') {
      if (evt.session_id) sessionId = evt.session_id;
      // mock 模式无 delta（answer 一次性到达）；流式模式 answer == acc
      if (evt.answer && evt.answer !== acc) {
        acc = acc ? acc + '\n' + evt.answer : evt.answer;
        ensureBubble().textContent = acc;
      } else if (evt.answer) {
        ensureBubble().textContent = acc;
      }
      if (evt.degraded) {
        const tips = {
          daily_token_budget_exceeded: '今日用量已达预算上限，本轮未调用模型',
          max_turns_per_session_exceeded: '本会话已达最大轮次',
        };
        addTip('⚠️ ' + (tips[evt.detail] || '服务暂时不可用，以上为兜底回复'));
        console.warn('降级详情:', evt.detail);
      }
      scrollBottom();
    }
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

btnNew.addEventListener('click', () => {
  sessionId = null;
  chat.innerHTML = '<div class="sys-tip">已开启新会话，上下文已清空。</div>';
  input.focus();
});

// 健康检查：显示当前模型 / API key 状态 / 今日用量
fetch('/api/health').then(r => r.json()).then(d => {
  let sub = `${d.model || 'mock'} · ${d.has_api_key ? 'API key 已配置' : '未配置 API key（只能用 mock 模式）'}`;
  if (d.daily_budget) sub += ` · 今日已用 ${d.today_tokens || 0}/${d.daily_budget} tokens`;
  document.getElementById('subTitle').textContent = sub;
}).catch(() => {});
input.focus();
</script>
</body>
</html>
